<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Case Tag Assistant Hub</title>

<style>

:root{
    --bg:#f8f5ee;
    --text:#2d2d2d;

    --header:#006838;          /* Papa Johns Green */
    --header-accent:#C41230;   /* Papa Johns Red */

    --card:#ffffff;

    --table-header:#006838;
    --table-text:#333;

    --search-border:#006838;
    --hover:#edf7f1;

    --kb:#006838;

    --input-bg:#ffffff;
}

.dark{
    --bg:#0f172a;
    --text:#f8fafc;
    --header:#111827;
    --header-accent:#C41230;
    --card:#1e293b;
    --table-header:#111827;
    --table-text:#f8fafc;
    --search-border:#475569;
    --hover:#243247;
    --kb:#4ade80;
    --input-bg:#334155;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:var(--bg);
    color:var(--text);
    transition:.3s;
}

/* HEADER */

.header{
    background:linear-gradient(
        180deg,
        #007a3d 0%,
        #006838 70%,
        #00552f 100%
    );

    border-bottom:6px solid #C41230;

    text-align:center;
    padding:25px;
    color:white;
    position:relative;

    box-shadow:0 3px 15px rgba(0,0,0,.25);
}

.header-content{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:0;
}


.logo{
    width:180px;
    height:auto;
    margin-top:0px;
    margin-bottom:-15px;
}

.header{
    padding:15px;
}

.title-section{
    text-align:center;
}

.title-section h1{
    margin:0;

    font-size:48px;
    font-weight:800;

    color:#fff;

    text-shadow:
        2px 2px 0 #C41230,
        0 3px 10px rgba(0,0,0,.3);
}



.title-section p{
    margin:0;
    font-size:18px;
    color:white;
}

.header h1{
    font-size:42px;
    margin-bottom:5px;
}

.header p{
    font-size:18px;
}

.theme-btn{

    position:absolute;

    top:20px;
    right:20px;

    padding:5px 12px;

    border:none;
    border-radius:8px;

    cursor:pointer;
    font-weight:600;

    background:white;
    color:#006838;

    z-index:9999;

    box-shadow:0 2px 8px rgba(0,0,0,.2);
}



.theme-btn:hover{
    opacity:.9;
}

.top-btn{

    position:fixed;

    top:60px;
    right:20px;

    padding:5px 12px;

    border:none;
    border-radius:8px;

    background:#C41230;
    color:white;

    cursor:pointer;

    z-index:9999;

    display:none;
}

.top-btn:hover{

    opacity:.9;
}


/* PAGE */

.container{
    padding:25px;
}

/* SEARCH */

.search-box{

    display:flex;
    gap:10px;

    margin-bottom:20px;
}

.search-box input{
    flex:1;
    width:100%;
    padding:16px;
    border:2px solid var(--search-border);
    border-radius:10px;
    font-size:16px;
    background:var(--input-bg);
    color:var(--text);
}

.search-box input:focus{
    outline:none;
}


#clearBtn{

    padding:16px 24px;

    border:none;
    border-radius:10px;

    background:#C41230;
    color:white;

    font-weight:600;
    cursor:pointer;

    transition:.3s;
}

#clearBtn:hover{

    background:#a30f26;
}

.page-nav{
    display:flex;
    gap:10px;
    margin-bottom:15px;
}

.nav-btn{
    background:#006838;
    color:white;
    border:none;
    border-radius:10px;
    padding:12px 20px;
    cursor:pointer;
    font-weight:600;
}

.nav-btn:hover{
    background:#C41230;
}

.nav-btn.active{
    background:#C41230;
}



/* STATS */

.stats{
    font-size:18px;
    font-weight:600;
    color:var(--kb);
    margin-bottom:15px;
}

/* TABLE */

.table-container{
    background:var(--card);
    border-radius:12px;

    overflow-x:hidden;   /* hide horizontal */
    overflow-y:auto;     /* keep vertical */

    max-width:100%;

    box-shadow:0 3px 15px rgba(0,0,0,.15);
}


.fixed-scrollbar{

    position:fixed;

    bottom:0;
    left:0;
    width:100%;
    overflow-x:auto;
    overflow-y:hidden;
    height:18px;
    background:#f4f4f4;
    z-index:9998;
    border-top:1px solid #ccc;
}

.fixed-scrollbar div{

    height:1px;
}


table{
    width:100%;
    border-collapse:collapse;
    min-width:1400px;
}

thead{
    position:sticky;
    top:0;
    z-index:10;
}

th{
    background:var(--table-header);
    color:white;
    padding:15px;
    text-align:left;
    font-size:14px;
}

td{
    padding:14px;
    border-bottom:1px solid rgba(128,128,128,.2);
    color:var(--table-text);
    vertical-align:top;
    text-transform: capitalize;
}

tr:hover{
    background:var(--hover);
}

.callissue{
    min-width:500px;
    line-height:1.5;
}

.kb{
    min-width:250px;
    color:var(--kb);
    font-weight:600;
}


.type{
    min-width:120px;
}

.classification{
    min-width:180px;
}

.subclassification{
    min-width:180px;
}

.issue{
    min-width:180px;
}



.kb-link{

    color:var(--kb);

    font-weight:bold;

    text-decoration:none;
}

.kb-link:hover{

    text-decoration:underline;

    color:#C41230;
}

.empty{
    text-align:center;
    padding:50px;
}

.creator{

    display:none;

    position:absolute;

    bottom:5px;
    left:10px;

    font-size:12px;

    color:#4ade80;

    font-weight:bold;
}

.dark .creator{

    display:block;

}

/* MOBILE */

@media(max-width:768px){

.header h1{
    font-size:30px;
}

.header p{
    font-size:16px;
}

.header-content{
    flex-direction:column;
}

.title-section{
    text-align:center;
}

.logo{
    width:90px;
}

.container{
    padding:15px;
}

}

</style>
</head>

 <div class="header-content">

let currentPage = "hub";

/************************
 HUB TABLE
************************/

function render(items){

    if(items.length === 0){

        results.innerHTML = `
        <div class="empty">
            No matching records found.
        </div>
        `;

        return;
    }

    items.sort((a,b)=>
        a.type.localeCompare(b.type)
    );

    results.innerHTML = `

    <div class="table-container">

    <table>

        <thead>

            <tr>
                <th>Call Issues</th>
                <th>Type</th>
                <th>Classification</th>
                <th>Sub-Classification</th>
                <th>Issue</th>
                <th>KB Article/s</th>
            </tr>

        </thead>

        <tbody>

        ${items.map(item => `

        <tr>

            <td class="callissue">${item.callIssue}</td>

            <td>${item.type}</td>

            <td>${item.classification}</td>

            <td>${item.subClassification}</td>

            <td>${item.issue}</td>

            <td class="kb">

                ${item.kb.split(/[\/,]/).map(kb=>{

                    kb = kb.trim();

                    return `
                    <a
                        href="https://papajohns.service-now.com/now/nav/ui/classic/params/target/kb_view.do?sysparm_article=${kb}"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="kb-link"
                    >
                        ${kb}
                    </a>
                    `;

                }).join(" / ")}

            </td>

        </tr>

        `).join("")}

        </tbody>

    </table>

    </div>

    `;
}

/************************
 MASTER LIST TABLE
************************/

function renderMaster(items){

    results.innerHTML = `

    <div class="table-container">

    <table>

        <thead>

        <tr>
            <th>Type</th>
            <th>Classification</th>
            <th>Sub Classification</th>
            <th>FSHD Issue</th>
        </tr>

        </thead>

        <tbody>

        ${items.map(item=>`

        <tr>

            <td>${item.type}</td>

            <td>${item.classification}</td>

            <td>${item.subClassification}</td>

            <td>${item.issue}</td>

        </tr>

        `).join("")}

        </tbody>

    </table>

    </div>

}

/************************
 KB MASTERLIST TABLE
************************/

function renderKBMaster(items){

    results.innerHTML = `

    <div class="table-container">

    <table>

        <thead>

        <tr>
            <th>KB</th>
            <th>KB Title</th>
            <th>Issues / Keywords</th>
        </tr>

        </thead>

        <tbody>

        ${items.map(item=>`

        <tr>

            <td>

                <a
                    href="https://papajohns.service-now.com/now/nav/ui/classic/params/target/kb_view.do?sysparm_article=${item.kb}"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="kb-link"
                >
                    ${item.kb}
                </a>

            </td>

            <td>${item.title}</td>

            <td>${item.issues}</td>

        </tr>

        `).join("")}

        </tbody>

    </table>

    </div>

    `;
}

************************/

    hubBtn.classList.remove("active");
    kbMasterBtn.classList.remove("active");

kbMasterBtn.addEventListener("click",()=>{

    kbMasterBtn.classList.add("active");
    hubBtn.classList.remove("active");
    masterBtn.classList.remove("active");

/************************
 SEARCH
************************/

search.addEventListener("input",()=>{

    const value = search.value.toLowerCase();

    if(currentPage === "hub"){

        render(
            data.filter(item=>
                Object.values(item)
                .join(" ")
                .toLowerCase()
                .includes(value)
            )
        );

    }else if(currentPage === "master"){

        renderMaster(
            masterList.filter(item=>
                Object.values(item)
                .join(" ")
                .toLowerCase()
                .includes(value)
            )
        );

    }else{

        renderKBMaster(
            kbMasterList.filter(item=>
                Object.values(item)
                .join(" ")
                .toLowerCase()
                .includes(value)
            )
        );

    }

    setTimeout(syncScrollbar,50);

});

/************************
 CLEAR
************************/

const clearBtn = document.getElementById("clearBtn");

clearBtn.addEventListener("click",()=>{

    search.value = "";

    if(currentPage === "hub"){

        render(data);

    }else if(currentPage === "master"){

        renderMaster(masterList);

    }else{

        renderKBMaster(kbMasterList);

    }

    search.focus();

    setTimeout(syncScrollbar,50);

});

/************************
 DARK MODE
************************/

const themeBtn = document.getElementById("themeToggle");

themeBtn.addEventListener("click",()=>{

    document.body.classList.toggle("dark");

    themeBtn.innerHTML =
        document.body.classList.contains("dark")
        ? "☀️ Light Mode"
        : "🌙 Dark Mode";

});

/************************
 TOP BUTTON
************************/

const topBtn = document.getElementById("topBtn");

window.addEventListener("scroll",()=>{

    topBtn.style.display =
        window.scrollY > 200
        ? "block"
        : "none";

});

topBtn.addEventListener("click",()=>{

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

});

/************************
 SCROLLBAR
************************/

function syncScrollbar(){

    const table = document.querySelector(".table-container");

    if(!table) return;

    table.style.overflowX = "scroll";
    table.style.scrollbarWidth = "none";

    const topScroller =
        document.getElementById("topScroller");

    const scrollContent =
        document.getElementById("scrollContent");

    scrollContent.style.width =
        table.scrollWidth + "px";

    topScroller.onscroll = ()=>{
        table.scrollLeft =
        topScroller.scrollLeft;
    };

    table.onscroll = ()=>{
        topScroller.scrollLeft =
        table.scrollLeft;
    };
}

render(data);

setTimeout(syncScrollbar,100);

window.addEventListener(
    "resize",
    syncScrollbar
);

</script>
